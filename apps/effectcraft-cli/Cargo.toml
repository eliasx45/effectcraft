[package]
name = "effectcraft-cli"
description = "EffectCraft headless CLI: render frames and sequences, run commands, MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "effectcraft-cli"
path = "src/main.rs"

[features]
default = ["ui"]
profile = ["effectcraft-gpu/profile", "effectcraft-render/profile"]
## `mcp --ui`: the full app offscreen in-process, so `screenshot` and the `ui_*` tools work without
## a window.
ui = ["effectcraft-ui-egui/offscreen"]

[dependencies]
effectcraft-engine = { workspace = true }
effectcraft-host = { workspace = true }
effectcraft-automation = { workspace = true }
effectcraft-ui-egui = { workspace = true }
# Fork-only: hardware ProRes decoding for previews (docs/adr/0001-platform-ffi.md).
effectcraft-platform = { workspace = true }
effectcraft-render = { workspace = true }
effectcraft-gpu = { workspace = true }
effectcraft-time = { workspace = true }
effectcraft-media = { workspace = true }
rayon = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true }
cpu-time = "1"
# `drive-pull`: Google Drive share links over HTTPS, pure-Rust TLS as motionlib's downloads.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls-rustcrypto = "0.0.2-alpha"

[dev-dependencies]
effectcraft-media = { workspace = true }
