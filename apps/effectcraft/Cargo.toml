[package]
name = "effectcraft"
description = "EffectCraft desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "effectcraft"

[lints]
workspace = true

[dependencies]
# Same winit as eframe: the window's monitors, size and position (src/window.rs), macOS
# event-loop options (no app activation when driven by an agent), and the window's event loop
# with surface configuration gated for the GPU compositor (RT10e).
winit = { version = "0.30", default-features = false }
effectcraft-engine = { workspace = true }
effectcraft-host = { workspace = true }
# The Figma bridge (the plug-in's local HTTP endpoint), run in-process.
effectcraft-automation = { workspace = true }
effectcraft-ui-egui = { workspace = true }
# Fork-only: hardware ProRes decoding for previews (docs/adr/0001-platform-ffi.md).
effectcraft-platform = { workspace = true }
egui = { workspace = true }
# `links`: links (Help menu, Discord, Settings) open in the system browser.
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "links", "wayland", "x11"] }
serde = { workspace = true }
serde_json = { workspace = true }
rfd = { workspace = true }
pollster = { workspace = true }
cpal = { workspace = true }
log = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Settings ▸ Appearance ▸ Sync with System: the XDG desktop portal's colour scheme. Already in
# Cargo.lock (accesskit, through eframe), so it adds no new crates.
zbus = "5.19"
# Whether the X server has DRI3 (zero-copy display is off without it, see `main.rs`). Already in
# Cargo.lock (winit's X11 backend); core protocol only, no extension features.
x11rb = { version = "0.13", default-features = false }

[build-dependencies]
# Icon + VERSIONINFO for effectcraft.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
# Keep the control channel responsive when the window is covered (App Nap / occlusion throttling).
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString", "NSObject"] }
# The native menu bar (NSMenu). MIT OR Apache-2.0; macOS only, never in the web build.
muda = { version = "0.21", default-features = false }
objc2 = "0.6"
# NSApplication hide / hide others / show all, and the pasteboard for Edit ▸ Paste in text fields.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSPasteboard"] }
# Finder double-click, Open With, Dock drops and `open -a EffectCraft x.ecproj` arrive as a
# kAEOpenDocuments Apple event, which winit 0.30 doesn't handle. This audited crate (also used by
# PhotoCraft and PdfCraft) registers the handler (Objective-C interop needs unsafe, which our
# workspace forbids) behind a safe API. Pinned exactly: review the diff before bumping.
fmv-macos-events = "=0.1.0"
