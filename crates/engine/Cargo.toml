[package]
name = "effectcraft-engine"
description = "The EffectCraft engine: session, undo history, editor state and the command registry every frontend (UI, CLI, control channel, MCP) dispatches through"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[build-dependencies]
effectcraft-buildgen = { workspace = true }

[dependencies]
effectcraft-time = { workspace = true }
effectcraft-geom = { workspace = true }
effectcraft-color = { workspace = true }
effectcraft-keyframe = { workspace = true }
effectcraft-project = { workspace = true }
effectcraft-raster = { workspace = true }
effectcraft-path = { workspace = true }
effectcraft-text = { workspace = true }
effectcraft-effects = { workspace = true }
effectcraft-render = { workspace = true }
effectcraft-segment = { workspace = true }
effectcraft-track = { workspace = true }
effectcraft-motionlib = { workspace = true }
effectcraft-model = { workspace = true }
effectcraft-lottie = { workspace = true }
effectcraft-aep = { workspace = true }
effectcraft-interchange = { workspace = true }
effectcraft-psd = { workspace = true }
kurbo = { workspace = true }
effectcraft-svg = { workspace = true }
effectcraft-pdf = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["unbounded_depth"] }
thiserror = { workspace = true }
log = { workspace = true }
rayon = { workspace = true }
image = { workspace = true }
gif = { workspace = true }
web-time = { workspace = true }
exr = { workspace = true }
# Pure-Rust zstd: whole projects for a remote frame server's replica (`remote_sync`).
ruzstd = { version = "0.9", default-features = false, features = ["std"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Safe shell API boundary; never use the crate's Unix mount enumeration.
trash = { version = "5.2.9", default-features = false, features = ["coinit_apartmentthreaded"] }

[target.'cfg(target_os = "macos")'.dependencies]
# MEM3: the system's memory and this process's resident size from the kernel, without starting
# `vm_stat`, `sysctl` or `ps` every few seconds. Safe APIs (MIT); no `unsafe` here.
sysctl = "0.6"
memory-stats = "1"

[target.'cfg(target_os = "linux")'.dependencies]
time = { version = "0.3.55", features = ["local-offset"] }

[dev-dependencies]
# The real expression engine, for tests that check what expressions read (preset markers).
effectcraft-expr = { workspace = true }
