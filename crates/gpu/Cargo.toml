[package]
name = "effectcraft-gpu"
description = "The GPU compositor (wgpu compute): layer transforms, masks/mattes, the 38 blend modes, motion blur, bit-depth quantisation and GPU effects, with the CPU renderer as the reference"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
profile = ["effectcraft-render/profile"]

[dependencies]
effectcraft-time = { workspace = true }
effectcraft-geom = { workspace = true }
effectcraft-color = { workspace = true }
effectcraft-project = { workspace = true }
effectcraft-raster = { workspace = true }
effectcraft-effects = { workspace = true }
effectcraft-render = { workspace = true }
effectcraft-keyframe = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
rayon = { workspace = true }
log = { workspace = true }
web-time = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = { workspace = true }
# Each kernel is compiled from a module holding only what it uses (`context::kernel_ir`), so the
# platform's shader cache keeps it across edits to other kernels. Same naga as wgpu's.
naga = { version = "30.0.1", features = ["wgsl-in"] }
wgpu = { workspace = true, features = ["naga-ir"] }

[dev-dependencies]
effectcraft-text = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
js-sys = "0.3"

# DX12's Auto compiler otherwise falls back to FXC, which crashes compiling pointwise.
# wgpu's static DXC is available only on Windows MSVC x64 (not ARM64).
[target.'cfg(all(target_os = "windows", target_env = "msvc", target_arch = "x86_64"))'.dependencies]
wgpu = { workspace = true, features = ["static-dxc"] }
