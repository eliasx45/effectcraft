[package]
name = "effectcraft-platform"
description = "OS media integration (fork-only): hardware ProRes decoding through VideoToolbox for previews, with transparent fallback to FilmCraft's pure-Rust decoder"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# The one crate allowed to contain `unsafe` (OS media FFI; docs/adr/0001-platform-ffi.md).
# The workspace lints, except that `unsafe_code` is `deny` instead of `forbid`: only the FFI module
# opts in with `#[allow(unsafe_code)]`, and every `unsafe` block carries a `// SAFETY:` comment.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
undocumented_unsafe_blocks = "deny"

[dependencies]
effectcraft-media = { workspace = true }
filmcraft-codecs = { workspace = true }
filmcraft-color = { workspace = true }
filmcraft-frame = { workspace = true }
filmcraft-isobmff = { workspace = true }
filmcraft-prores = { workspace = true }
filmcraft-time = { workspace = true }
log = { workspace = true }

# Apple framework bindings (generated declarations; Zlib OR Apache-2.0 OR MIT; macOS only).
# objc2-core-foundation was already in Cargo.lock (through eframe / winit).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = "0.3.2"
# Cursor location during a Finder drag (cursor.rs: CGEventCreate + CGEventGetLocation); already in the lockfile.
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGEvent", "CGEventTypes"] }
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-video-toolbox = "0.3.2"

[dev-dependencies]
effectcraft-project = { workspace = true }
effectcraft-render = { workspace = true }
effectcraft-time = { workspace = true }
