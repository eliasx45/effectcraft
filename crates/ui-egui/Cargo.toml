[package]
name = "effectcraft-ui-egui"
description = "The EffectCraft egui frontend (swappable): docking panels, composition viewer, timeline, effect controls, control channel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# The integration tests are one binary (tests/ui/main.rs declares every tests/*.rs): one link of
# the app instead of one per file. `cargo test -p effectcraft-ui-egui --test ui ui_viewer::`
autotests = false

[lints]
workspace = true

[[test]]
name = "ui"
path = "tests/ui/main.rs"

[features]
## The full app offscreen (`offscreen::OffscreenUi`: egui_kittest + wgpu, no window), used by
## `effectcraft-cli mcp --ui`.
offscreen = ["dep:egui_kittest"]

[dependencies]
craft-ui = { workspace = true }
effectcraft-time = { workspace = true }
effectcraft-geom = { workspace = true }
effectcraft-color = { workspace = true }
effectcraft-keyframe = { workspace = true }
effectcraft-project = { workspace = true }
effectcraft-path = { workspace = true }
effectcraft-text = { workspace = true }
effectcraft-render = { workspace = true }
effectcraft-engine = { workspace = true }
effectcraft-gpu = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
rayon = { workspace = true }
web-time = { workspace = true }
kurbo = { workspace = true }
image = { workspace = true }
egui_kittest = { workspace = true, features = ["eframe", "wgpu"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# CR6b: decoding the cloud playback stream's H.264 chunks.
effectcraft-media = { workspace = true }
# EMBED5b: a hosted Timeline reads the person's shortcuts from EffectCraft's settings folder.
effectcraft-host = { workspace = true }
pollster = { workspace = true }
sys-locale = { workspace = true }

[dev-dependencies]
# Examples (`snapshot`) and tests use the offscreen app.
effectcraft-ui-egui = { path = ".", features = ["offscreen"] }
egui_kittest = { workspace = true, features = ["eframe", "wgpu"] }
effectcraft-host = { workspace = true }
exr = { workspace = true }

[build-dependencies]
effectcraft-buildgen = { workspace = true }
serde_json = { workspace = true }
toml = "1"
